          - heading "Purge caches" [level=2] [ref=f24e81]
          - generic [ref=f24e82]:
            - paragraph [ref=f24e83]: Moodle can cache themes, JavaScript, language strings, filtered text, RSS feeds and other pieces of calculated data. Purging caches will delete data from the server and force browsers to re-fetch data, so you can be sure you are seeing the most up-to-date values produced by the current code. There is no danger in purging caches, but your site may appear slower for a while until the server and clients calculate new information and cache it.
